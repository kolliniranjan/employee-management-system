<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register | Employee Management System</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom CSS -->
    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="auth-page">


<div class="auth-container">


    <!-- ==========================================
         REGISTER CARD
         ========================================== -->

    <div class="auth-card">


        <!-- BRAND -->

        <div class="auth-brand text-center">

            <div class="brand-icon">
                EMS
            </div>

            <h3>
                Create Account
            </h3>

            <p class="text-muted">
                Join the Employee Management System
            </p>

        </div>


        <!-- ERROR -->

        <div
            id="registerError"
            class="alert alert-danger d-none">
        </div>


        <!-- SUCCESS -->

        <div
            id="registerSuccess"
            class="alert alert-success d-none">
        </div>


        <!-- ==========================================
             REGISTER FORM
             ========================================== -->

        <form id="registerForm">


            <!-- NAME -->

            <div class="row g-3">


                <div class="col-md-6">

                    <label
                        for="firstName"
                        class="form-label">

                        First Name

                    </label>

                    <input
                        type="text"
                        id="firstName"
                        class="form-control"
                        placeholder="Enter first name"
                        required>

                </div>


                <div class="col-md-6">

                    <label
                        for="lastName"
                        class="form-label">

                        Last Name

                    </label>

                    <input
                        type="text"
                        id="lastName"
                        class="form-control"
                        placeholder="Enter last name"
                        required>

                </div>

            </div>


            <!-- EMAIL -->

            <div class="mb-3 mt-3">

                <label
                    for="email"
                    class="form-label">

                    Email Address

                </label>

                <input
                    type="email"
                    id="email"
                    class="form-control"
                    placeholder="Enter email address"
                    required>

            </div>


            <!-- PASSWORD -->

            <div class="mb-3">

                <label
                    for="password"
                    class="form-label">

                    Password

                </label>

                <div class="input-group">

                    <input
                        type="password"
                        id="password"
                        class="form-control"
                        placeholder="Create password"
                        minlength="6"
                        required>

                    <button
                        type="button"
                        id="togglePassword"
                        class="btn btn-outline-secondary">

                        <i class="bi bi-eye"></i>

                    </button>

                </div>

                <small class="text-muted">
                    Password must contain at least 6 characters.
                </small>

            </div>


            <!-- ROLE -->

            <div class="mb-4">

                <label
                    for="role"
                    class="form-label">

                    Account Role

                </label>

                <input
                    type="text"
                    id="role"
                    class="form-control"
                    value="EMPLOYEE"
                    readonly>

                <small class="text-muted">
                    New public accounts are registered as employees.
                </small>

            </div>


            <!-- REGISTER BUTTON -->

            <button
                type="submit"
                id="registerButton"
                class="btn btn-primary w-100">

                <i class="bi bi-person-plus me-1"></i>

                Create Account

            </button>


        </form>


        <!-- LOGIN LINK -->

        <div class="text-center mt-4">

            <span class="text-muted">
                Already have an account?
            </span>

            <a
                href="login.html"
                class="fw-semibold text-decoration-none">

                Login

            </a>

        </div>


    </div>

</div>


<script src="js/register.js"></script>

</body>

</html>
