<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>
        Change Password | Employee Management System
    </title>


    <!-- ==========================================
         BOOTSTRAP
         ========================================== -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ==========================================
         BOOTSTRAP ICONS
         ========================================== -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">


    <!-- ==========================================
         CUSTOM CSS
         ========================================== -->

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="dashboard-body">


<!-- ==========================================
     SIDEBAR
     ========================================== -->

<div
    class="sidebar"
    id="sidebar">


    <div class="sidebar-brand">

        <div class="brand-icon-small">
            EMS
        </div>

        <div>

            <h5>
                Employee MS
            </h5>

            <small>
                Management System
            </small>

        </div>

    </div>


    <hr>


    <nav class="sidebar-nav">


        <a
            href="dashboard.html"
            class="nav-link">

            <i class="bi bi-grid-1x2-fill"></i>

            Dashboard

        </a>


        <a
            href="employees.html"
            class="nav-link">

            <i class="bi bi-people-fill"></i>

            Employees

        </a>


        <a
            href="departments.html"
            class="nav-link">

            <i class="bi bi-building"></i>

            Departments

        </a>


        <a
            href="profile.html"
            class="nav-link">

            <i class="bi bi-person-fill"></i>

            Profile

        </a>


        <a
            href="change-password.html"
            class="nav-link active">

            <i class="bi bi-shield-lock-fill"></i>

            Change Password

        </a>

    </nav>


    <div class="sidebar-bottom">

        <button
            type="button"
            id="logoutButton"
            class="btn btn-outline-light w-100">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </button>

    </div>

</div>


<!-- ==========================================
     MAIN CONTENT
     ========================================== -->

<div class="main-content">


    <!-- ==========================================
         TOP NAVBAR
         ========================================== -->

    <nav class="top-navbar">


        <button
            type="button"
            id="sidebarToggle"
            class="btn btn-light d-lg-none">

            <i class="bi bi-list"></i>

        </button>


        <div>

            <h5 class="mb-0">

                Change Password

            </h5>

            <small class="text-muted">

                Update your account password

            </small>

        </div>

    </nav>


    <!-- ==========================================
         CONTENT
         ========================================== -->

    <main
        class="container-fluid dashboard-container">


        <div
            class="content-card profile-card">


            <!-- ======================================
                 HEADER
                 ====================================== -->

            <div class="profile-header">


                <div class="profile-avatar">

                    <i
                        class="bi bi-shield-lock-fill">
                    </i>

                </div>


                <div>

                    <h3>
                        Change Password
                    </h3>

                    <p class="text-muted mb-0">

                        Keep your account secure by
                        updating your password.

                    </p>

                </div>

            </div>


            <hr>


            <!-- ======================================
                 MESSAGE
                 ====================================== -->

            <div
                id="passwordMessage"
                class="alert d-none"
                role="alert">
            </div>


            <!-- ======================================
                 CHANGE PASSWORD FORM
                 ====================================== -->

            <form
                id="changePasswordForm"
                action="javascript:void(0);"
                onsubmit="return false;">


                <!-- CURRENT PASSWORD -->

                <div class="mb-4">

                    <label
                        for="currentPassword"
                        class="profile-label">

                        Current Password

                    </label>


                    <input
                        type="password"
                        id="currentPassword"
                        class="form-control"
                        placeholder="Enter current password"
                        autocomplete="current-password"
                        required>

                </div>


                <!-- NEW PASSWORD -->

                <div class="mb-4">

                    <label
                        for="newPassword"
                        class="profile-label">

                        New Password

                    </label>


                    <input
                        type="password"
                        id="newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                        autocomplete="new-password"
                        minlength="6"
                        required>


                    <small class="text-muted">

                        Minimum 6 characters.

                    </small>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="mb-4">

                    <label
                        for="confirmPassword"
                        class="profile-label">

                        Confirm New Password

                    </label>


                    <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm new password"
                        autocomplete="new-password"
                        minlength="6"
                        required>

                </div>


                <!-- ==================================
                     BUTTONS
                     ================================== -->

                <div
                    class="d-flex gap-2 flex-wrap">


                    <button
                        type="submit"
                        id="changePasswordButton"
                        class="btn btn-primary">

                        <i
                            class="bi bi-shield-lock me-1">
                        </i>

                        Change Password

                    </button>


                    <a
                        href="profile.html"
                        class="btn btn-outline-secondary">

                        <i
                            class="bi bi-arrow-left me-1">
                        </i>

                        Back to Profile

                    </a>

                </div>


            </form>


        </div>


    </main>


</div>


<!-- ==========================================
     CHANGE PASSWORD JAVASCRIPT
     ========================================== -->

<script src="js/change-password.js"></script>


</body>

</html>
