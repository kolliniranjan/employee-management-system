<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile | Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="dashboard-body">


<!-- ==========================================
     SIDEBAR
     ========================================== -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-brand">

        <div class="brand-icon-small">
            EMS
        </div>

        <div>

            <h5>Employee MS</h5>

            <small>
                Management System
            </small>

        </div>

    </div>


    <hr>


    <nav class="sidebar-nav">

        <a
            href="dashboard.html"
            class="nav-link">

            <i class="bi bi-grid-1x2-fill"></i>

            Dashboard

        </a>


        <a
            href="employees.html"
            class="nav-link">

            <i class="bi bi-people-fill"></i>

            Employees

        </a>


        <a
            href="departments.html"
            class="nav-link">

            <i class="bi bi-building"></i>

            Departments

        </a>

    </nav>


    <div class="sidebar-bottom">

        <button
            id="logoutButton"
            class="btn btn-outline-light w-100">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </button>

    </div>

</div>


<!-- ==========================================
     MAIN CONTENT
     ========================================== -->

<div class="main-content">


    <!-- TOP NAVBAR -->

    <nav class="top-navbar">

        <button
            id="sidebarToggle"
            class="btn btn-light d-lg-none">

            <i class="bi bi-list"></i>

        </button>


        <div>

            <h5 class="mb-0">
                Profile
            </h5>

            <small class="text-muted">
                Manage your account information
            </small>

        </div>

    </nav>


    <!-- ==========================================
         PROFILE CONTENT
         ========================================== -->

    <main class="container-fluid dashboard-container">


        <div class="content-card profile-card">


            <!-- PROFILE HEADER -->

            <div class="profile-header">

                <div class="profile-avatar">

                    <i class="bi bi-person-fill"></i>

                </div>


                <div>

                    <h3 id="profileName">
                        User
                    </h3>

                    <p
                        id="profileEmail"
                        class="text-muted mb-1">

                        user@example.com

                    </p>


                    <span
                        id="profileRole"
                        class="badge bg-primary">

                        ROLE_USER

                    </span>

                </div>

            </div>


            <hr>


            <!-- ACCOUNT INFORMATION -->

            <h5 class="mb-4">
                Account Information
            </h5>


            <div class="row g-4">


                <div class="col-md-6">

                    <label class="profile-label">
                        First Name
                    </label>

                    <div
                        id="profileFirstName"
                        class="profile-value">

                        -

                    </div>

                </div>


                <div class="col-md-6">

                    <label class="profile-label">
                        Last Name
                    </label>

                    <div
                        id="profileLastName"
                        class="profile-value">

                        -

                    </div>

                </div>


                <div class="col-md-6">

                    <label class="profile-label">
                        Email
                    </label>

                    <div
                        id="profileEmailValue"
                        class="profile-value">

                        -

                    </div>

                </div>


                <div class="col-md-6">

                    <label class="profile-label">
                        Role
                    </label>

                    <div
                        id="profileRoleValue"
                        class="profile-value">

                        -

                    </div>

                </div>

            </div>


            <hr class="my-4">


            <div class="d-flex gap-2">

                <a
                    href="dashboard.html"
                    class="btn btn-primary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Back to Dashboard

                </a>

            </div>


        </div>

    </main>

</div>


<script src="js/profile.js"></script>

</body>

</html>
