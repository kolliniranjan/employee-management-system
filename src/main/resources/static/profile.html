<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Profile | Employee Management System</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body class="dashboard-body">


<!-- ==========================================
     SIDEBAR
     ========================================== -->

<div class="sidebar" id="sidebar">

    <div class="sidebar-brand">

        <div class="brand-icon-small">
            EMS
        </div>

        <div>

            <h5>Employee MS</h5>

            <small>
                Management System
            </small>

        </div>

    </div>


    <hr>


    <nav class="sidebar-nav">

        <a
            href="dashboard.html"
            class="nav-link">

            <i class="bi bi-grid-1x2-fill"></i>

            Dashboard

        </a>


        <a
            href="employees.html"
            class="nav-link">

            <i class="bi bi-people-fill"></i>

            Employees

        </a>


        <a
            href="departments.html"
            class="nav-link">

            <i class="bi bi-building"></i>

            Departments

        </a>

    </nav>


    <div class="sidebar-bottom">

        <button
            id="logoutButton"
            class="btn btn-outline-light w-100">

            <i class="bi bi-box-arrow-right"></i>

            Logout

        </button>

    </div>

</div>


<!-- ==========================================
     MAIN CONTENT
     ========================================== -->

<div class="main-content">


    <!-- ==========================================
         TOP NAVBAR
         ========================================== -->

    <nav class="top-navbar">

        <button
            id="sidebarToggle"
            class="btn btn-light d-lg-none">

            <i class="bi bi-list"></i>

        </button>


        <div>

            <h5 class="mb-0">
                Profile
            </h5>

            <small class="text-muted">
                Manage your account information
            </small>

        </div>

    </nav>


    <!-- ==========================================
         PROFILE CONTENT
         ========================================== -->

    <main class="container-fluid dashboard-container">


        <div class="content-card profile-card">


            <!-- ==========================================
                 PROFILE HEADER
                 ========================================== -->

            <div class="profile-header">

                <div class="profile-avatar">

                    <i class="bi bi-person-fill"></i>

                </div>


                <div>

                    <h3 id="profileName">
                        User
                    </h3>

                    <p
                        id="profileEmail"
                        class="text-muted mb-1">

                        user@example.com

                    </p>


                    <span
                        id="profileRole"
                        class="badge bg-primary">

                        ROLE_USER

                    </span>

                </div>

            </div>


            <hr>


            <!-- ==========================================
                 ACCOUNT INFORMATION
                 ========================================== -->

            <h5 class="mb-4">
                Account Information
            </h5>


            <div class="row g-4">


                <!-- FIRST NAME -->

                <div class="col-md-6">

                    <label class="profile-label">
                        First Name
                    </label>

                    <div
                        id="profileFirstName"
                        class="profile-value">

                        -

                    </div>

                </div>


                <!-- LAST NAME -->

                <div class="col-md-6">

                    <label class="profile-label">
                        Last Name
                    </label>

                    <div
                        id="profileLastName"
                        class="profile-value">

                        -

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="col-md-6">

                    <label class="profile-label">
                        Email
                    </label>

                    <div
                        id="profileEmailValue"
                        class="profile-value">

                        -

                    </div>

                </div>


                <!-- ROLE -->

                <div class="col-md-6">

                    <label class="profile-label">
                        Role
                    </label>

                    <div
                        id="profileRoleValue"
                        class="profile-value">

                        -

                    </div>

                </div>

            </div>


            <!-- ==========================================
                 ORGANIZATION INFORMATION
                 ========================================== -->

            <hr class="my-4">


            <h5 class="mb-4">
                Organization Information
            </h5>


            <div class="row g-4">


                <!-- ORGANIZATION NAME -->

                <div class="col-md-6">

                    <label class="profile-label">
                        Organization Name
                    </label>

                    <div
                        id="profileOrganizationName"
                        class="profile-value">

                        -

                    </div>

                </div>


                <!-- ORGANIZATION TYPE -->

                <div class="col-md-6">

                    <label class="profile-label">
                        Organization Type
                    </label>

                    <div
                        id="profileOrganizationType"
                        class="profile-value">

                        -

                    </div>

                </div>


                <!-- ORGANIZATION ID -->

                <div class="col-md-6">

                    <label class="profile-label">
                        Organization ID
                    </label>

                    <div
                        id="profileOrganizationId"
                        class="profile-value">

                        -

                    </div>

                </div>

            </div>


            <!-- ==========================================
                 CHANGE PASSWORD
                 ========================================== -->

            <hr class="my-4">


            <h5 class="mb-2">
                Change Password
            </h5>

            <p class="text-muted mb-4">
                Update your account password securely.
            </p>


            <form id="changePasswordForm">


                <!-- CURRENT PASSWORD -->

                <div class="row">

                    <div class="col-md-8">

                        <div class="mb-3">

                            <label
                                for="currentPassword"
                                class="form-label">

                                Current Password

                            </label>

                            <input
                                type="password"
                                id="currentPassword"
                                class="form-control"
                                placeholder="Enter current password"
                                required>

                        </div>


                        <!-- NEW PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="newPassword"
                                class="form-label">

                                New Password

                            </label>

                            <input
                                type="password"
                                id="newPassword"
                                class="form-control"
                                placeholder="Enter new password"
                                minlength="6"
                                required>

                            <small class="text-muted">
                                Minimum 6 characters.
                            </small>

                        </div>


                        <!-- CONFIRM PASSWORD -->

                        <div class="mb-3">

                            <label
                                for="confirmPassword"
                                class="form-label">

                                Confirm New Password

                            </label>

                            <input
                                type="password"
                                id="confirmPassword"
                                class="form-control"
                                placeholder="Confirm new password"
                                minlength="6"
                                required>

                        </div>


                        <!-- MESSAGE -->

                        <div
                            id="passwordMessage"
                            class="small mb-3 d-none">
                        </div>


                        <!-- BUTTON -->

                        <button
                            type="submit"
                            id="changePasswordButton"
                            class="btn btn-primary">

                            <i class="bi bi-shield-lock me-1"></i>

                            Change Password

                        </button>

                    </div>

                </div>

            </form>


            <!-- ==========================================
                 ACTIONS
                 ========================================== -->

            <hr class="my-4">


            <div class="d-flex gap-2">

                <a
                    href="dashboard.html"
                    class="btn btn-primary">

                    <i class="bi bi-arrow-left me-1"></i>

                    Back to Dashboard

                </a>

            </div>


        </div>

    </main>

</div>


<!-- ==========================================
     JAVASCRIPT
     ========================================== -->

<script src="js/profile.js"></script>

</body>

</html>
