# ============================================================
# APPLICATION IDENTITY
# ============================================================
spring.application.name=employee-management-system

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8080

# ============================================================
# DATASOURCE CONFIGURATION (MySQL)
# ============================================================
# JDBC URL:
#  - localhost:3306      -> MySQL host and port
#  - employee_management_db -> database name (must be created beforehand, see note below)
#  - createDatabaseIfNotExist=true -> auto-creates the DB if missing (dev convenience)
#  - useSSL=false        -> disables SSL for local development (enable in production)
#  - serverTimezone=UTC  -> avoids timezone mismatch errors between JVM and MySQL
#  - allowPublicKeyRetrieval=true -> required for MySQL 8 default auth plugin over non-SSL
spring.datasource.url=jdbc:mysql://localhost:3306/employee_management_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# HIKARICP CONNECTION POOL
# ============================================================
# Explicitly configured (rather than relying on defaults) for predictability
# in an enterprise/production-style setup.
spring.datasource.hikari.pool-name=EmployeeMgmtHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
# ddl-auto=update -> Hibernate auto-creates/updates tables from entities.
# NOTE: Suitable for development only. In production, use ddl-auto=validate
# and manage schema changes via Flyway/Liquibase migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Logs generated SQL to the console (great for learning/debugging).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Explicit MySQL dialect so Hibernate generates MySQL-optimized SQL.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Disables Open-Session-In-View. Forces all lazy-loading/data access to
# happen deliberately inside the service layer instead of implicitly
# during view rendering — prevents hidden N+1 query bugs.
spring.jpa.open-in-view=false

# ============================================================
# LOGGING (helpful while learning / debugging)
# ============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.web=INFO
# ============================================================
# JWT CONFIGURATION
# ============================================================

# Base64 encoded secret key (minimum 256-bit for HS256)
jwt.secret=VGhpc0lzQVN1cGVyU2VjdXJlSldUU2VjcmV0S2V5Rm9yU3ByaW5nQm9vdDM=

# Token expiration time (24 Hours)
jwt.expiration=86400000
# ============================================================
# SWAGGER CONFIGURATION
# ============================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html