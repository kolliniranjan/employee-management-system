# ============================================================
# APPLICATION IDENTITY
# ============================================================
spring.application.name=employee-management-system


# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=${PORT:8080}


# ============================================================
# DATASOURCE CONFIGURATION
# ============================================================
spring.datasource.url=${DB_URL}

spring.datasource.username=${DB_USERNAME}

spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ============================================================
# HIKARICP CONNECTION POOL
# ============================================================
spring.datasource.hikari.pool-name=EmployeeMgmtHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000


# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}

spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.jpa.show-sql=${SHOW_SQL:false}

spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.jpa.open-in-view=false


# ============================================================
# LOGGING
# ============================================================
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:INFO}

logging.level.org.springframework.web=INFO

logging.level.org.springframework.web.servlet.mvc.method.annotation.RequestMappingHandlerMapping=INFO


# ============================================================
# JWT CONFIGURATION
# ============================================================
jwt.secret=${JWT_SECRET}

jwt.expiration=${JWT_EXPIRATION:86400000}


# ============================================================
# SWAGGER CONFIGURATION
# ============================================================
springdoc.api-docs.enabled=true

springdoc.swagger-ui.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html